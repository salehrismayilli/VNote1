<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>VNote</title>
<style>
:root{--fb:#000;--sheet:#141416;--card:#1c1c1e;--cardbg:#1c1c1e;--f:255,255,255;--tx:#fff;--ac:#ff7a1a;--mu:rgba(var(--f),.55);--ln:rgba(var(--f),.1);font-family:"Avenir Next","SF Pro Rounded","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fb);color:var(--tx);overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px)}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 20px 4px;gap:10px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-1.4px;line-height:1}
#count{display:block;color:var(--mu);font-size:13px;margin:4px 0 0;letter-spacing:0;font-weight:500}
.hr{display:flex;align-items:center;gap:6px}
#zoom{width:70px;accent-color:var(--ac)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--f),.08)}
#sbar{padding:6px 20px 0}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:7px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(var(--f),.08);font-size:14px;font-weight:600}
.cat.on{background:var(--tx);color:var(--fb)}
.cat i,.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:rgba(var(--f),.12);overflow:hidden}
i img,.ni img,.thumb img,.ficon img{width:100%;height:100%;object-fit:cover}
.list{padding:4px 16px 220px;display:grid;gap:var(--gap,10px);max-width:760px;margin:0 auto;min-height:60vh;touch-action:pan-y}
.z1{grid-template-columns:1fr}.z2{grid-template-columns:repeat(2,1fr)}.z3{grid-template-columns:repeat(3,1fr);gap:8px}.z4{grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 10px 220px}
.note{position:relative;background:var(--cardbg);color:var(--tx);border:1px solid var(--ln);border-radius:var(--rad,20px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:opacity .4s,transform .1s}
.note:active{transform:scale(.985)}
.z1 .note{display:flex;align-items:center;gap:12px;padding:var(--dy,11px) 14px}
.z2 .note,.z3 .note,.z4 .note{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 8px 12px;gap:6px}
.ni{flex:none;border-radius:13px;background:rgba(var(--f),.09);display:grid;place-items:center;overflow:hidden}
.z1 .ni{width:40px;height:40px;font-size:21px}.z2 .ni{width:58px;height:58px;font-size:30px}.z3 .ni{width:46px;height:46px;font-size:24px}.z4 .ni{width:36px;height:36px;font-size:19px;border-radius:10px}
.nt{font-weight:700;line-height:1.2;overflow:hidden;word-break:break-word}
.z1 .nt{flex:1;font-size:17px}.z2 .nt{font-size:15px}.z3 .nt{font-size:13px}.z4 .nt{font-size:11px}
.z2 .nt,.z3 .nt,.z4 .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rt{font-size:12px;color:var(--ac);white-space:nowrap;font-weight:600}.z4 .rt{font-size:9px}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;color:#fff;font-size:15px;line-height:1}
.chk.on{background:var(--ac);border-color:var(--ac)}.chk.on::after{content:"✓"}
.z2 .chk,.z3 .chk,.z4 .chk{position:absolute;top:7px;right:7px;width:22px;height:22px;font-size:12px}
.z4 .chk{width:18px;height:18px;font-size:10px;top:4px;right:4px}
.note.done .nt{text-decoration:line-through;opacity:.5}.note.done .ni{opacity:.5}.note.gone{opacity:.25}
.note.busy .nt{opacity:.7;font-style:italic}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:60px 30px;line-height:1.6}
.empty b{display:block;color:var(--tx);font-size:20px;margin-bottom:6px}
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:30px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--fb) 60%);pointer-events:none;z-index:5}
#dock>*{pointer-events:auto}
.dr{display:flex;align-items:center;gap:22px}
#kb{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--ln);display:grid;place-items:center}
.sp{width:52px}
#mic{width:var(--ms,88px);height:var(--ms,88px);border-radius:50%;background:linear-gradient(145deg,#ffa04a,#ee5a00);display:grid;place-items:center;color:#fff;box-shadow:0 10px 34px rgba(255,122,26,.45),inset 0 1px 0 rgba(255,255,255,.4);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s}
#mic svg{width:38px;height:38px}
#mic.rec{transform:scale(1.2);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 22px rgba(255,122,26,.2)}}
#hint{margin:8px 0 0;font-size:12px;color:var(--mu)}
#rbar{position:fixed;left:12px;right:12px;z-index:28;display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--ln);box-shadow:0 8px 30px rgba(0,0,0,.35);border-radius:24px;padding:10px 12px;max-width:640px;margin:0 auto;animation:up .18s ease-out}
#rbar[data-m=hold] #rcancel,#rbar[data-m=hold] #rsend{display:none}
#rbar[data-p="1"]{background:#7a1e1e;color:#fff}
#rcancel,#rsend{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(var(--f),.1);display:grid;place-items:center}
#rsend{background:var(--ac);color:#fff}
.rmid{flex:1;min-width:0}.rr{display:flex;align-items:center;gap:10px}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff4a4a;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#rtime{font-variant-numeric:tabular-nums;font-weight:700;min-width:36px}
#wave{flex:1;height:30px;min-width:0}
#rtxt{flex:1;font-size:14px;line-height:1.35;max-height:60px;overflow:hidden;opacity:.85}
#rhint{font-size:12px;color:var(--mu);margin-top:4px}
#prev{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(0,0,0,.7);pointer-events:none}
.pc{width:min(90vw,520px);max-height:62vh;overflow:hidden;background:var(--sheet);color:var(--tx);border:1px solid var(--ln);border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.pc .nh{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:19px;font-weight:700}
.pl{padding:3px 0;line-height:1.45;opacity:.88;white-space:pre-wrap}.pl.ck{text-decoration:line-through;opacity:.5}
#full{position:fixed;inset:0;z-index:25;background:var(--fb);overflow-y:auto;display:flex;flex-direction:column;animation:up .22s ease-out;transition:transform .2s}
#full.out{transform:translateY(100%)}
#fullIn{flex:1;width:100%;max-width:680px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top,0px)) 18px 30px}
.ftop{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:0;background:var(--fb);z-index:3;padding:4px 0}
.ib2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:rgba(var(--f),.75);flex:none}
.ficon{flex:none;width:34px;height:34px;border-radius:11px;background:rgba(var(--f),.09);display:grid;place-items:center;font-size:18px;overflow:hidden}
.ft{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:17px;font-weight:600;color:var(--mu)}
.ft:focus{color:var(--tx)}
.fcov{height:110px;border-radius:18px;background-size:cover;background-position:center;margin:0 0 12px}
#player{margin-bottom:10px}#player audio{width:100%;height:40px;margin-bottom:6px}
.rw{display:flex;gap:10px;align-items:flex-start;padding:0}
.rw textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;resize:none;font-size:16px;line-height:1.55;padding:4px 0;overflow:hidden;color:var(--tx)}
.rw.ck textarea{text-decoration:line-through;opacity:.45}
.cb{flex:none;width:22px;height:22px;margin-top:7px;border-radius:7px;border:2px solid var(--mu);display:grid;place-items:center;font-size:13px;color:#fff}
.cb.on{background:var(--ac);border-color:var(--ac)}.cb.on::after{content:"✓"}
.att{display:flex;gap:8px;overflow-x:auto;margin:16px 0 8px;padding-bottom:4px}
.tile{flex:none;width:92px;height:92px;border-radius:16px;background:rgba(var(--f),.08);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mu);padding:6px;text-align:center}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;border-radius:12px}
.tile svg{width:30px;height:30px}.tile span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-around;padding:4px 2px calc(6px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--ln)}
.fbar button{width:42px;height:44px;display:grid;place-items:center;color:rgba(var(--f),.62)}
.fbar button.on{color:var(--ac)}.fbar button:active{background:rgba(var(--f),.1);border-radius:12px}
.fbar svg{width:21px;height:21px}
#viewer{position:fixed;inset:0;z-index:45;background:#000;color:#fff;display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}.vtop .ib2{color:#fff}
.vn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbody{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y}
.vbody img{width:100%;max-width:none;height:auto;display:block;margin:auto}
.vbody video{width:100%;max-height:100%}
.vdoc{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px;text-align:center}.vdoc svg{width:64px;height:64px}.vdoc audio{width:90vw}
.vbar{display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));background:#111;border-top:1px solid #222}
.vbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#ddd;min-width:58px}.vbar small{font-size:11px}.vbar .dng{color:#ff8a8a}
#sheetwrap,#popwrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
#sheetwrap{z-index:30}#popwrap{z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--sheet);color:var(--tx);border-radius:26px 26px 0 0;padding:0 18px calc(60px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{position:sticky;top:0;z-index:2;background:var(--sheet);display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
.sheet h2{margin:0;font-size:21px;letter-spacing:-.5px}
.sheet h3{margin:22px 0 10px;font-size:14px;color:var(--ac);font-weight:700}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}
.ths{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ths button{height:64px;border-radius:16px;border:2px solid transparent;font-size:11px;font-weight:700;display:flex;align-items:flex-end;padding:6px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ths button.on{border-color:var(--ac)}
.btn{padding:10px 16px;border-radius:14px;background:rgba(var(--f),.09);font-size:14px;font-weight:600}
.btn.pri{background:var(--ac);color:#fff}.btn.dng{color:#ff6b6b}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 6px;font-size:16px;border-bottom:1px solid var(--ln)}
.act.dng{color:#ff6b6b}
.fld{width:100%;background:rgba(var(--f),.07);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;outline:0}
.thumb{width:52px;height:52px;border-radius:14px;background:rgba(var(--f),.09);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.crow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.crow input{flex:1;min-width:0}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.egrid button{font-size:26px;padding:8px 0;border-radius:12px;background:rgba(var(--f),.07)}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(var(--f),.09);font-size:13px;font-weight:600}
.chip.big{padding:9px 14px 9px 8px;font-size:15px}.chip.on{background:var(--ac);color:#fff}
.tog{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:15px}
.tog small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.tog input{width:46px;height:26px;accent-color:var(--ac)}
.info{font-size:13px;color:var(--mu);line-height:1.5;margin-bottom:10px}
select.fld option{color:#000}
#toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--tx);color:var(--fb);padding:10px 18px;border-radius:18px;font-weight:600;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}#toast:not(.on){pointer-events:none!important}
@media (prefers-reduced-motion:reduce){#mic.rec,.rdot,#full,.sheet,.pc,#rbar{animation:none}}
.tog select.fld.sel{width:auto;max-width:55%;padding:8px 10px}
.list.todo{display:block;padding:8px 16px 220px;max-width:640px}
.tdadd{display:flex;gap:8px;margin-bottom:10px}.tdplus{flex:none;width:50px;border-radius:14px;background:var(--ac);color:#fff;display:grid;place-items:center}
.tdbar,.trbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.td{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--ln)}
.tdc{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--mu);display:grid;place-items:center;color:#fff;font-size:14px}
.tdc.on{background:var(--ac);border-color:var(--ac)}.tdc.on::after{content:"✓"}
.tdt{flex:1;font-size:16px;word-break:break-word}.td.done .tdt{text-decoration:line-through;opacity:.45}
.tdx{flex:none;width:34px;height:34px;color:var(--mu);display:grid;place-items:center;opacity:.6}.tdx svg{width:18px;height:18px}
.trbar{grid-column:1/-1}
.pc{max-height:72vh;overflow:auto}
.pact{display:flex;gap:8px;margin-top:14px}.pact button{flex:1;padding:12px 6px;border-radius:14px;background:rgba(var(--f),.09);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}.pact .dng{color:#ff6b6b}
#toast button{margin-left:10px;color:var(--ac);font-weight:800}
.ed{outline:0;font-size:var(--fs,16px);line-height:1.6;min-height:40vh;word-break:break-word;caret-color:var(--ac)}
.ed.ro{min-height:0;pointer-events:none}
.ed .ln{position:relative;min-height:1.6em}
.ed .ln[data-c]{padding-left:34px}
.ed .ln[data-c]::before{content:"";position:absolute;left:2px;top:.22em;width:22px;height:22px;border:2px solid var(--mu);border-radius:7px;box-sizing:border-box}
.ed .ln[data-c="2"]::before{content:"✓";background:var(--ac);border-color:var(--ac);color:#fff;font-size:13px;line-height:18px;text-align:center}
body:not(.nostrike) .ed .ln[data-c="2"]{text-decoration:line-through;opacity:.5}
.ed.empty .ln:first-child::after{content:var(--ph);color:var(--mu);position:absolute;left:0;top:0;pointer-events:none}
.ed.empty .ln:first-child[data-c]::after{left:34px}
.fmeta{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 10px}.fmeta:empty{display:none}
.fmeta button{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(var(--f),.08);color:var(--mu)}.fmeta .w{color:#ff8a8a}
#ftool{position:sticky;bottom:0;z-index:4;background:var(--sheet);border-top:1px solid var(--ln)}
.pal{display:flex;gap:7px;justify-content:center;padding:8px 8px 2px;flex-wrap:wrap}.pal button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(var(--f),.25);color:var(--mu);font-size:12px}
#ftool .fbar{position:static;background:none;border:0;display:flex;justify-content:flex-start;overflow-x:auto;padding:2px 4px calc(6px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
#ftool .fbar::-webkit-scrollbar{display:none}
#ftool .fbar button{flex:none;width:46px;height:46px;display:grid;place-items:center;color:rgba(var(--f),.78);font-size:17px;font-weight:700}
#ftool .fbar button:active{background:rgba(var(--f),.1);border-radius:12px}
.tA{border-bottom:3px solid #ff5252;line-height:1}.tH{background:#ffd600;color:#000;padding:0 4px;border-radius:3px;line-height:1.15}
#ftool .fbar sup,#ftool .fbar sub{font-size:10px;line-height:0}#ftool .fbar button{white-space:nowrap}
#sel{position:fixed;z-index:26;display:flex;gap:2px;padding:4px;background:var(--sheet);border:1px solid var(--ln);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#sel button{width:40px;height:38px;font-size:16px;font-weight:700;display:grid;place-items:center;color:var(--tx)}
.sw2{display:flex;gap:10px;flex-wrap:wrap}.sw2 button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}.sw2 button.on{border-color:var(--tx)}
.aud{display:flex;align-items:center;gap:6px;margin-bottom:6px}.aud audio{flex:1;min-width:0;height:40px}.adel{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(var(--f),.09);color:#ff6b6b;display:grid;place-items:center}
.mic-right #dock{align-items:flex-end;padding-right:22px}.mic-left #dock{align-items:flex-start;padding-left:22px}
.noicons .note .ni{display:none}.nometa .fmeta{display:none!important}
.noanim *{animation:none!important;transition:none!important}
button,.note,.cat,.chip,.tile,.act,.td{touch-action:manipulation}
.list{align-content:start}
#dock{align-items:flex-end;padding:0 18px calc(14px + env(safe-area-inset-bottom,0px)) 18px;background:none}
.hastabs #dock{bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:12px}
.mic-center #dock{align-items:center;padding-left:0;padding-right:0}.mic-left #dock{align-items:flex-start;padding-left:18px}
.mic-right #dock{padding-right:18px}
.dr{gap:14px}.sp{display:none}.mic-center .sp{display:block}.mic-center .dr{gap:22px}
#hint{margin:0 0 8px;font-size:12px;color:var(--mu);text-align:right}.mic-center #hint{text-align:center}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--sheet);border-top:1px solid var(--ln);padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px))}
#tabbar[hidden]{display:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mu);font-size:11px;font-weight:600}
#tabbar button.on{color:var(--ac)}#tabbar svg{width:22px;height:22px}
#tabbar b{background:var(--ac);color:#fff;border-radius:99px;padding:0 6px;font-size:10px;margin-left:3px}
#toast{bottom:210px}
.rep{max-height:42vh;overflow:auto;background:rgba(var(--f),.06);border-radius:12px;padding:10px;font-size:11px;line-height:1.4;white-space:pre-wrap;word-break:break-all;user-select:text;margin:0 0 12px}

function init(){return new Promise(r=>{try{const q=indexedDB.open('yadda',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('n'))d.createObjectStore('n',{keyPath:'id'});if(!d.objectStoreNames.contains('s'))d.createObjectStore('s');if(!d.objectStoreNames.contains('f'))d.createObjectStore('f')};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const st=(n,m)=>db.transaction(n,m||'readonly').objectStore(n);
const getS=k=>new Promise(r=>{if(!db)return r();try{const q=st('s').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const getN=()=>new Promise(r=>{if(!db)return r([]);try{const q=st('n').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});

/* notlar yüngül yazılır; fayllar (şəkil, səs) ayrıca mağazada saxlanır və yalnız dəyişəndə yazılır */
const FSAVED=new WeakSet(),pendingN=new Map();let pT;
const fid=()=>'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function flushN(){
  if(!db||!pendingN.size)return;
  const list=[...pendingN.values()];pendingN.clear();const done=[];
  try{
    const tx=db.transaction(['n','f'],'readwrite'),ns=tx.objectStore('n'),fs=tx.objectStore('f');
    list.forEach(n=>{
      const files=(n.files||[]).map(f=>{if(!f.id)f.id=fid();if(f.blob&&!FSAVED.has(f.blob)){fs.put(f.blob,f.id);done.push(f.blob)}return{id:f.id,name:f.name,type:f.type,size:f.blob?f.blob.size:(f.size||0)}});
      if(n.cover&&!FSAVED.has(n.cover)){fs.put(n.cover,n.id+':cover');done.push(n.cover)}
      if(n.iconImg&&!FSAVED.has(n.iconImg)){fs.put(n.iconImg,n.id+':icon');done.push(n.iconImg)}
      ns.put(Object.assign({},n,{files,cover:null,iconImg:null,hasCover:!!n.cover,hasIcon:!!n.iconImg}));
    });
    tx.oncomplete=()=>done.forEach(b=>FSAVED.add(b));
    tx.onerror=()=>log('IDB write error');
  }catch(e){log('IDB '+e.message)}
}
const putN=n=>{if(!db)return;pendingN.set(n.id,n);clearTimeout(pT);pT=setTimeout(flushN,120)};
const delN=id=>{pendingN.delete(id);if(db)try{st('n','readwrite').delete(id)}catch(e){}};
addEventListener('visibilitychange',()=>{if(document.hidden)flushN()});addEventListener('pagehide',flushN);
async function hydrate(){
  if(!db)return;
  const map=await new Promise(r=>{const out={};try{const q=st('f').openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else r(out)};q.onerror=()=>r(out)}catch(e){r(out)}});
  const used=new Set();
  S.notes.forEach(n=>{
    (n.files||[]).forEach(f=>{if(!f.blob&&f.id&&map[f.id]){f.blob=map[f.id];FSAVED.add(f.blob)}if(f.id)used.add(f.id)});
    if(n.hasCover){used.add(n.id+':cover');if(map[n.id+':cover']){n.cover=map[n.id+':cover'];FSAVED.add(n.cover)}}
    if(n.hasIcon){used.add(n.id+':icon');if(map[n.id+':icon']){n.iconImg=map[n.id+':icon'];FSAVED.add(n.iconImg)}}
  });
  const junk=Object.keys(map).filter(k=>!used.has(k));
  if(junk.length)try{const tx=db.transaction('f','readwrite');junk.forEach(k=>tx.objectStore('f').delete(k))}catch(e){}
  /* köhnə quruluş (blob notun içində) → yeni mağazaya köçür */
  S.notes.forEach(n=>{if((n.files||[]).some(f=>f.blob&&!FSAVED.has(f.blob))||(n.cover&&!FSAVED.has(n.cover))||(n.iconImg&&!FSAVED.has(n.iconImg)))putN(n)});
}

const U=new WeakMap();
function url(b){if(!b)return '';let u=U.get(b);if(!u){u=URL.createObjectURL(b);U.set(b,u)}return u}
async function shrink(f,max){
  max=max||1280;if(!f.type.startsWith('image/')||f.type==='image/gif')return f;
  try{
    const bmp=await createImageBitmap(f),k=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();
    return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.85));
  }catch(e){return shrinkOld(f,max)}
}
function shrinkOld(f,max){return new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);r(b||f)},'image/jpeg',.85)};i.onerror=()=>r(f);i.src=u})}
async function rotateImg(f){
  try{
    const bmp=await createImageBitmap(f),c=document.createElement('canvas');c.width=bmp.height;c.height=bmp.width;
    const g=c.getContext('2d');g.translate(c.width/2,c.height/2);g.rotate(Math.PI/2);g.drawImage(bmp,-bmp.width/2,-bmp.height/2);bmp.close&&bmp.close();
    return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.85));
  }catch(e){return rotateOld(f)}
}
function rotateOld(f){return new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const c=document.createElement('canvas');c.width=i.height;c.height=i.width;const g=c.getContext('2d');g.translate(c.width/2,c.height/2);g.rotate(Math.PI/2);g.drawImage(i,-i.width/2,-i.height/2);c.toBlob(b=>{URL.revokeObjectURL(u);r(b||f)},'image/jpeg',.85)};i.onerror=()=>r(f);i.src=u})}

const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function shareFile(f){
  try{
    if(CP.Filesystem&&CP.Share){const w=await CP.Filesystem.writeFile({path:'vnote_'+Date.now()+'_'+f.name.replace(/[^\w.\-]+/g,'_'),data:await b64(f.blob),directory:'CACHE'});await CP.Share.share({title:f.name,url:w.uri,dialogTitle:f.name});return}
    const file=new File([f.blob],f.name,{type:f.type});

  }catch(e){if(e&&/cancel|abort/i.test(String(e.message||e)))return}

}

const nid=n=>Math.floor(n.id/1000)%2000000000, WT={};

async function schedule(n){
  cancelRem(n);if(!n.remind||n.remind<=Date.now()||n.done||n.deleted)return;
  const body=plain(n.text).replace(/\s+/g,' ').slice(0,140);
  if(LN){try{const p=await LN.requestPermissions();if(p.display!=='granted'){toast(t('notifOff'));return}
    await LN.schedule({notifications:[{id:nid(n),title:n.title||'VNote',body,schedule:{at:new Date(n.remind),allowWhileIdle:true}}]})}catch(e){}}
  else if('Notification' in window){try{await Notification.requestPermission()}catch(e){}
    WT[n.id]=setTimeout(()=>{try{new Notification(n.title||'VNote',{body,icon:'icons/icon-192.png'})}catch(e){}},Math.min(n.remind-Date.now(),2147000000))}

    if(palMode==='fore')exec('foreColor',col||getComputedStyle(document.documentElement).getPropertyValue('--tx').trim()||'#ffffff');
    else exec('hiliteColor',col?col+'99':'transparent');

  const c=b.dataset.cmd;

  if(rem){n.remind=rem;schedule(n)}
  putN(n);render();if(fullId==n.id)openFull(n.id,true);
  if(rem)toast(t('remSet')+rtime(rem));else if(cid)toast(t('savedTo')+catOf(cid).name);
}
async function handleRecording(blob,dur,pk,target){
  if(dur<700||pk<0.008||blob.size<1500){toast(t('tooShort'));return}
  const base=(blob.type||'audio/webm').split(';')[0],ext=base.includes('mp4')?'m4a':base.includes('ogg')?'ogg':'webm',file={name:'voice.'+ext,type:base,blob};
  if(target){const n=byId(target);if(n){n.files=(n.files||[]).concat([file]);putN(n);toast(t('transcribing'));await fillNote(n,blob,{append:true});return}}
  const n=newNoteBase({title:t('voiceNote'),busy:true,files:[file]});
  S.notes.push(n);putN(n);render();await fillNote(n,blob);
}
async function retry(n){
  const f=(n.files||[]).find(x=>x.type.startsWith('audio/'));if(!f)return;
  n.busy=true;putN(n);toast(t('transcribing'));
  if(fullId==n.id){flush();hideFull();fullId=null}else render();
  await fillNote(n,f.blob);
}

/* ---------- səs yazma (WhatsApp tərzi) ---------- */
let run=false,starting=false,mode='hold',engine='',held=false,locked=false,want=false,discard=false,cancelPend=false,t0=0,downAt=0,sx0=0,sy0=0,lastErr='',acc='',seg='',tInt,pendStop=null,recTarget=null;
let ms,mr,chunks=[],actx,actxP,srcN,an,raf,peak=0,lv=[];
const hasKey=()=>!!getKey();
let testMode=false,idleT;
function bar(on){const b=$('#rbar');b.hidden=!on;b.style.bottom=`calc(${fullId?76:172}px + env(safe-area-inset-bottom,0px))`;$('#mic').classList.toggle('rec',on&&!recTarget)}
function barUI(){const b=$('#rbar');b.dataset.m=mode;b.dataset.p=cancelPend?'1':'0';$('#rhint').textContent=mode==='hold'?(cancelPend?t('release'):t('slide')):''}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('#rtime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function jn(a,b){a=(a||'').trim();b=(b||'').trim();if(!b)return a;if(!a)return b;const la=a.toLowerCase(),lb=b.toLowerCase();
  if(lb.startsWith(la))return b;if(la.endsWith(lb)||la.includes(lb))return a;return a+' '+b}
async function cloudStart(){
  clearTimeout(idleT);if(!(ms&&ms.getAudioTracks().some(x=>x.readyState==='live')))ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1}});
  const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
  chunks=[];peak=0;lv=[];
  mr=new MediaRecorder(ms,mt?{mimeType:mt,audioBitsPerSecond:64000}:{});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=onCloudStop;mr.start(500);
  try{actx=actxP||(actxP=new (window.AudioContext||window.webkitAudioContext)());if(actx.state==='suspended')actx.resume();an=actx.createAnalyser();an.fftSize=512;srcN=actx.createMediaStreamSource(ms);srcN.connect(an);drawWave()}catch(e){an=null;log('analyser '+e.message)}
}
function drawWave(){const c=$('#wave'),g=c.getContext('2d'),d=new Uint8Array(an.fftSize);
  const loop=()=>{if(!an)return;an.getByteTimeDomainData(d);let m=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]-128)/128;if(v>m)m=v}
    peak=Math.max(peak,m);lv.push(m);if(lv.length>44)lv.shift();
    const w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;g.clearRect(0,0,w,h);g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ac')||'#ff7a1a';const bw=w/44;
    lv.forEach((v,i)=>{const bh=Math.max(5,Math.min(h,v*h*2));g.fillRect(i*bw+2,(h-bh)/2,bw-4,bh)});raf=requestAnimationFrame(loop)};loop()}
function stopStream(){try{ms&&ms.getTracks().forEach(x=>x.stop())}catch(e){}ms=null}
function cloudCleanup(){cancelAnimationFrame(raf);an=null;try{srcN&&srcN.disconnect()}catch(e){}actx=null;clearTimeout(idleT);idleT=setTimeout(stopStream,20000)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!run)stopStream()});
function onCloudStop(){
  const dur=Date.now()-t0,type=((mr&&mr.mimeType)||'audio/webm').split(';')[0],blob=new Blob(chunks,{type}),pk=peak,tg=recTarget;
  cloudCleanup();run=false;recTarget=null;const tm=testMode;testMode=false;
  if(discard){toast(t('cancelled'));return}
  if(tm){showTest(blob,dur,pk);return}
  handleRecording(blob,dur,pk,tg);
}
function onSeg(x){seg=x;$('#rtxt').textContent=jn(acc,seg)||t('listen')}
let idle=0;
function sessionEnd(){if(!run)return;const had=!!seg;acc=jn(acc,seg);seg='';idle=had?0:idle+1;if(want&&(mode==='hold'?held:true)&&idle<4)listen();else finishSR(acc)}
function finishSR(text){if(!run)return;run=false;want=false;clearInterval(tInt);bar(false);const tg=recTarget;recTarget=null;
  if(discard){toast(t('cancelled'));return}
  if((text||'').trim())addNote(text,tg);else toast(/not-allowed|denied|permission/i.test(lastErr)?t('micPerm'):t('noSpeech'))}
function listen(){NSR?nativeListen():webListen()}
function webListen(){
  const rec=new SR();rec.lang=SPEECH[S.cfg.lang]||'az-AZ';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=e=>{let x='';for(let k=0;k<e.results.length;k++)x+=e.results[k][0].transcript+' ';onSeg(x)};
  rec.onerror=e=>{lastErr=e.error};rec.onend=sessionEnd;window._rec=rec;
  try{rec.start()}catch(e){finishSR(acc)}
}
async function nativeListen(){
  try{const r=await NSR.start({language:SPEECH[S.cfg.lang]||'az-AZ',maxResults:1,partialResults:true,popup:false});
    if(r&&r.matches&&r.matches[0]&&!seg)onSeg(r.matches[0])}
  catch(e){lastErr=String(e&&e.message||e);if(run){acc=jn(acc,seg);seg='';finishSR(acc)}}
}
function voiceTest(){if(!anyKey()){toast(t('keyOff'));return}closeSheet();testMode=true;startRec('latch')}
async function showTest(blob,dur,pk){
  const order=[S.cfg.prov].concat(['gemini','google','groq','openai'].filter(p=>p!==S.cfg.prov)).filter(p=>getKey(p));
  const head=`${(dur/1000).toFixed(1)} s · ${Math.round(blob.size/1024)} KB · ${t('testPeak')}: ${pk.toFixed(2)}${pk<0.05?' — '+t('testQuiet'):''}`;
  const tail=p=>p===S.cfg.prov?`<span class="tcur">✓ ${t('engineCur')}</span>`:`<button class="btn tuse" data-p="${p}">${t('useEngine')}</button>`;
  const pp=pop(`<div class="sh"><h2>${t('testTitle')}</h2></div><div class="info">${head}</div>${order.map(p=>`<div class="teng" data-p="${p}"><div class="th"><b>${ENG[p]}</b><span class="tms">⏳</span><span class="tail">${tail(p)}</span></div><div class="ed ro tres" style="pointer-events:auto;user-select:text">⏳</div></div>`).join('')}`);
  const wire=()=>pp.querySelectorAll('.tuse').forEach(b=>b.onclick=()=>{S.cfg.prov=b.dataset.p;saveCfg();pp.querySelectorAll('.teng').forEach(e=>{e.querySelector('.tail').innerHTML=tail(e.dataset.p)});wire();toast(ENG[S.cfg.prov]+' ✓')});
  wire();
  order.forEach(async p=>{const el=pp.querySelector(`.teng[data-p="${p}"]`),T=performance.now();
    try{const x=await transcribe(blob,p);el.querySelector('.tres').textContent=x||t('testEmpty')}catch(e){el.querySelector('.tres').textContent='⚠ '+e.message;log('TEST FAIL '+p+' '+e.message)}
    el.querySelector('.tms').textContent=Math.round(performance.now()-T)+' ms'});
}
async function startRec(m,target){
  if(run||starting)return;
  engine=((hasKey()||(testMode&&anyKey()))&&navigator.mediaDevices&&window.MediaRecorder)?'cloud':NSR?'native':SR?'web':'';
  if(!engine){toast(t('noSR'));return}
  starting=true;mode=m;discard=false;cancelPend=false;acc='';seg='';lastErr='';pendStop=null;recTarget=target||null;idle=0;
  try{
    if(engine==='cloud')await cloudStart();
    else if(NSR){const p=await NSR.requestPermissions();if(p&&p.speechRecognition==='denied')throw new Error('denied');
      try{await NSR.removeAllListeners()}catch(e){}
      NSR.addListener('partialResults',d=>{if(run&&d&&d.matches&&d.matches[0])onSeg(d.matches[0])});
      NSR.addListener('listeningState',d=>{if(d&&d.status==='stopped')sessionEnd()})}
  }catch(e){starting=false;recTarget=null;toast(t('micPerm'));return}
  starting=false;run=true;want=true;t0=Date.now();
  if(pendStop==='latch'||locked)mode='latch';
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  bar(true);barUI();tick();clearInterval(tInt);tInt=setInterval(tick,250);
  $('#wave').hidden=engine!=='cloud';$('#rtxt').hidden=engine==='cloud';$('#rtxt').textContent=t('listen');
  if(engine!=='cloud')listen();
  const ps=pendStop;pendStop=null;if(ps==='send')endRec(true);else if(ps==='cancel')endRec(false);
}
function endRec(send){
  if(!run)return;discard=!send;want=false;clearInterval(tInt);bar(false);
  if(engine==='cloud'){try{mr.stop()}catch(e){onCloudStop()}}
  else{
    if(NSR){try{NSR.stop()}catch(e){}}else{try{window._rec&&window._rec.stop()}catch(e){}}
    setTimeout(()=>{if(run){acc=jn(acc,seg);finishSR(acc)}},2500);
  }
}
const mic=$('#mic');
mic.addEventListener('pointerdown',e=>{e.preventDefault();
  if(run){if(mode==='latch')endRec(true);return}
  held=true;locked=false;downAt=Date.now();sx0=e.clientX;sy0=e.clientY;cancelPend=false;try{mic.setPointerCapture(e.pointerId)}catch(x){}startRec('hold')});
window.addEventListener('pointermove',e=>{
  if(!held||!(run||starting))return;
  const dx=e.clientX-sx0,dy=e.clientY-sy0;
  if(dy<-60&&!locked){locked=true;if(run&&mode==='hold'){mode='latch';cancelPend=false;barUI()}return}
  if(mode==='hold'&&!locked){const c=dx<-90;if(c!==cancelPend){cancelPend=c;barUI()}}});
function up(allowLatch){
  if(!held)return;held=false;
  if(starting){pendStop=locked?'latch':cancelPend?'cancel':(allowLatch&&Date.now()-downAt<350?'latch':'send');return}
  if(!run)return;
  if(locked||mode==='latch'){mode='latch';barUI();return}
  if(cancelPend)endRec(false);
  else if(allowLatch&&Date.now()-downAt<350){mode='latch';barUI()}
  else endRec(true);
}
['pointerup','touchend','mouseup'].forEach(ev=>window.addEventListener(ev,()=>up(true)));
['pointercancel','touchcancel','blur'].forEach(ev=>window.addEventListener(ev,()=>up(false)));
mic.addEventListener('contextmenu',e=>e.preventDefault());
$('#rcancel').onclick=()=>endRec(false);
$('#rsend').onclick=()=>endRec(true);

/* ---------- başlanğıc ---------- */
function setIcons(){
  $('#sbtn').innerHTML=svg('search');$('#gear').innerHTML=svg('sl');$('#kb').innerHTML=svg('pen');$('#mic').innerHTML=svg('mic');
  $('#rcancel').innerHTML=svg('trash');$('#rsend').innerHTML=svg('send');
  [['tb_ck','ck'],['tb_ls','ls'],['tb_un','undo'],['tb_re','rot']].forEach(x=>$('#'+x[0]).innerHTML=svg(x[1]));
}
(async function(){
  await init();
  const saved=await getS('cfg');S.cfg=Object.assign({},DEF,saved||{});
  if(!saved){const nl=(navigator.language||'az').slice(0,2);S.cfg.lang=L[nl]?nl:'az';saveCfg()}
  if(!L[S.cfg.lang])S.cfg.lang='az';
  S.cfg.keys=Object.assign({gemini:'',groq:'',openai:'',google:''},S.cfg.keys||{});if(S.cfg.key){if(!S.cfg.keys[S.cfg.prov])S.cfg.keys[S.cfg.prov]=S.cfg.key;S.cfg.key=''}saveCfg();
  if(!TH[S.cfg.theme]||S.cfg.tone){S.cfg.theme=TH[S.cfg.theme]?S.cfg.theme:'amoled';delete S.cfg.tone}
  S.cats=(await getS('cats'))||(()=>{const d=[{id:'c1',icon:'💼'},{id:'c2',icon:'🏠'},{id:'c3',icon:'💡'}].map((x,i)=>({id:x.id,name:t('cats')[i],icon:x.icon,img:null}));putS('cats',d);return d})();
  S.notes=await getN();S.todos=(await getS('todos'))||[];await hydrate();
  if((S.cfg.cv||0)<3){S.cfg.micSide='right';S.cfg.cv=3;saveCfg()}
  S.notes.forEach(n=>{if(n.done){n.done=false;putN(n)}});
  {const td=S.cfg.trashDays;if(td>0){const lim=Date.now()-td*864e5;S.notes.filter(n=>n.deleted&&n.deleted<lim).forEach(n=>delN(n.id));S.todos=S.todos.filter(x=>!(x.deleted&&x.deleted<lim));S.notes=S.notes.filter(n=>!(n.deleted&&n.deleted<lim))}}
  S.notes.forEach(n=>{if(n.busy){n.busy=false;n.err=n.err||'interrupted';if(!n.text)n.title=t('voiceNote');putN(n)}});
  setIcons();applyLang();applyCfg();applyOpts();render();
  if(!NC)S.notes.forEach(n=>{if(n.remind>Date.now()&&!n.deleted)schedule(n)});
  if('serviceWorker' in navigator){
    if(NC){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});try{caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}catch(e){}}
    else if(location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})}
  /* adi açılış HEÇ VAXT yazmağı başlatmır; yalnız ikonda basılı saxlayıb "Səs yaz" qısayolu seçəndə */
  const shortcut=()=>setTimeout(()=>startRec('latch'),500);
  if(new URLSearchParams(location.search).get('rec')==='1'){try{history.replaceState(null,'',location.pathname)}catch(e){}shortcut()}
  if(NC){try{const A=CP.App;
    A.addListener('appUrlOpen',e=>{if(e&&e.url&&e.url.indexOf('vnote://record')===0)shortcut()});
    A.addListener('backButton',()=>{if(!$('#popwrap').hidden)closePop();else if(!$('#sheetwrap').hidden)closeSheet();else if(!$('#viewer').hidden)closeViewer();else if(!$('#full').hidden)closeFull();else A.exitApp()});
    const l=await A.getLaunchUrl();if(l&&l.url&&l.url.indexOf('vnote://record')===0)shortcut()}catch(e){}}
})();
